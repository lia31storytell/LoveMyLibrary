<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveMyLibrary</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="styles.css">

  <!-- Librerie 3D e ePUB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
</head>
<body>

  <header>
    <div class="logo">✨ LoveMyLibrary</div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <button id="pwa-install-btn" class="btn-pink" style="display: none;">📱 Installa App</button>
      <button id="theme-toggle" class="btn-primary">☀️ Chiaro</button>
      <span id="user-badge" style="font-weight: bold; color: var(--accent-lilac);"></span>
      <button id="logout-btn" class="btn-primary" style="display: none;" onclick="logout()">Esci</button>
    </div>
  </header>

  <!-- SCHERMATA DI AUTENTICAZIONE (LOGIN / REGISTRAZIONE) -->
  <div id="auth-screen" style="max-width: 450px; margin: 4rem auto; padding: 1rem;">
    <div class="card" style="text-align: center;">
      <h2 id="auth-title">🔐 Accedi a LoveMyLibrary</h2>
      
      <form id="auth-form" onsubmit="handleAuth(event)">
        <div style="margin-bottom: 1rem; text-align: left;">
          <label>Username / Email</label>
          <input type="text" id="auth-username" required placeholder="Inserisci il tuo username">
        </div>
        <div style="margin-bottom: 1rem; text-align: left;">
          <label>Password</label>
          <input type="password" id="auth-password" required placeholder="••••••••">
        </div>

        <button type="submit" id="auth-submit-btn" class="btn-pink" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
          Accedi
        </button>
      </form>

      <div style="margin-top: 1.5rem; font-size: 0.9rem;">
        <span id="auth-toggle-text">Non hai un account?</span> 
        <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)" style="color: var(--accent-lilac); font-weight: bold; text-decoration: none;">Registrati qui</a>
      </div>
    </div>
  </div>

  <!-- CONTENUTO PRINCIPALE (VISIBILE SOLO DOPO IL LOGIN) -->
  <main id="app-content" style="display: none; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem;">
    
    <!-- 1. RICERCA GENERALE -->
    <section class="card">
      <h2>🔍 Cerca Libri (Google Books) o Utenti</h2>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="global-search-input" placeholder="Cerca titolo, autore, ISBN o username...">
        <button class="btn-primary" onclick="handleGlobalSearch()">Cerca</button>
      </div>
      <div id="search-results-container" style="margin-top: 1rem;"></div>
    </section>

    <!-- 2. AGGIUNTA LIBRO -->
    <section class="card">
      <h2>➕ Aggiungi un Nuovo Libro</h2>
      <form id="add-book-form" onsubmit="submitNewBook(event)">
        <div class="form-grid">
          <div>
            <label>Titolo *</label>
            <input type="text" id="book-title" required placeholder="Es. Il Nome della Rosa">
          </div>
          <div>
            <label>Autore *</label>
            <input type="text" id="book-author" required placeholder="Es. Umberto Eco">
          </div>
          <div>
            <label>Valutazione</label>
            <select id="book-rating">
              <option value="5">⭐⭐⭐⭐⭐</option>
              <option value="4">⭐⭐⭐⭐</option>
              <option value="3">⭐⭐⭐</option>
              <option value="2">⭐⭐</option>
              <option value="1">⭐</option>
            </select>
          </div>
          <div>
            <label>Livello Spicy</label>
            <select id="book-spicy">
              <option value="0">Nessuno</option>
              <option value="1">🌶️</option>
              <option value="2">🌶️🌶️</option>
              <option value="3">🌶️🌶️🌶️</option>
              <option value="4">🌶️🌶️🌶️🌶️</option>
              <option value="5">🌶️🌶️🌶️🌶️🌶️</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 1rem;">
          <label>URL Copertina (opzionale)</label>
          <input type="text" id="book-cover-url" placeholder="https://link-immagine.jpg">
        </div>

        <button type="submit" class="btn-pink" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
          🚀 Salva Libro nella Mia Libreria
        </button>
      </form>
    </section>

    <!-- 3. LIBRERIA 3D & LISTA LIBRI -->
    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>📚 La Tua Libreria 3D</h2>
        <span id="books-count-badge" style="background: var(--accent-lilac); color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold;">0 Libri</span>
      </div>
      <p style="font-size: 0.9rem; color: var(--text-secondary);">
        💡 Clicca su un libro nel 3D per selezionarlo e aprire la sua chat!
      </p>
      
      <div id="canvas-3d-container"></div>

      <!-- LISTA LIBRI SALVATI -->
      <h3 style="margin-top: 1.5rem;">📋 I Tuoi Libri Salvati:</h3>
      <div id="my-books-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;">
        <!-- I libri inseriti appariranno qui -->
      </div>
    </section>

    <!-- 4. CHAT COMMUNITY -->
    <section class="card">
      <h2 id="current-chat-title">💬 Chat Generale</h2>
      <div id="chat-messages-box" style="height: 200px; border: 1px solid var(--border-color); overflow-y: auto; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background-color: var(--bg-surface);">
      </div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="chat-input-text" placeholder="Scrivi un messaggio...">
        <button class="btn-primary" onclick="sendChatMessage()">Invia</button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
